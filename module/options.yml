meta:
  version: 1.0.0
options:
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{overlay_group}}'
  hasHeader: true
  children:
  - url: resource-grid-overlay.overlay.key
    name: resource-grid-overlay-key
    text: '{{overlay_key}}'
    display: Choice
    contents:
      type: string
      value: letter_g
      choices:
      - name: letter_g
        text: '{{key_letter_g}}'
      - name: letter_a
        text: '{{key_letter_a}}'
      - name: letter_b
        text: '{{key_letter_b}}'
      - name: letter_f
        text: '{{key_letter_f}}'
      - name: letter_i
        text: '{{key_letter_i}}'
      - name: letter_j
        text: '{{key_letter_j}}'
      - name: letter_l
        text: '{{key_letter_l}}'
      - name: letter_m
        text: '{{key_letter_m}}'
      - name: letter_n
        text: '{{key_letter_n}}'
      - name: letter_o
        text: '{{key_letter_o}}'
      - name: letter_p
        text: '{{key_letter_p}}'
      - name: letter_s
        text: '{{key_letter_s}}'
      - name: letter_w
        text: '{{key_letter_w}}'
      - name: letter_y
        text: '{{key_letter_y}}'
      - name: letter_z
        text: '{{key_letter_z}}'
      - name: f1
        text: '{{key_f1}}'
      - name: f2
        text: '{{key_f2}}'
      - name: f3
        text: '{{key_f3}}'
      - name: f4
        text: '{{key_f4}}'
      - name: f5
        text: '{{key_f5}}'
      - name: f6
        text: '{{key_f6}}'
      - name: f7
        text: '{{key_f7}}'
      - name: f8
        text: '{{key_f8}}'
      - name: f9
        text: '{{key_f9}}'
      - name: numpad_multiply
        text: '{{key_numpad_multiply}}'
      - name: numpad_add
        text: '{{key_numpad_add}}'
      - name: numpad_subtract
        text: '{{key_numpad_subtract}}'
      - name: numpad_decimal
        text: '{{key_numpad_decimal}}'
      - name: numpad_divide
        text: '{{key_numpad_divide}}'
      - name: insert
        text: '{{key_insert}}'
      - name: delete_key
        text: '{{key_delete_key}}'
      - name: home
        text: '{{key_home}}'
      - name: end_key
        text: '{{key_end_key}}'
      - name: page_up
        text: '{{key_page_up}}'
      - name: page_down
        text: '{{key_page_down}}'
      - name: caps_lock
        text: '{{key_caps_lock}}'
  - url: resource-grid-overlay.overlay.outside_editor
    name: resource-grid-overlay-outside-editor
    text: '{{overlay_outside_editor}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: resource-grid-overlay.overlay.flattened_only
    name: resource-grid-overlay-flattened-only
    text: '{{overlay_flattened_only}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: resource-grid-overlay.overlay.hide_in_v_view
    name: resource-grid-overlay-hide-in-v-view
    text: '{{overlay_hide_in_v_view}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: resource-grid-overlay.overlay.grid_colour
    name: resource-grid-overlay-grid-colour
    text: '{{overlay_grid_colour}}'
    display: Choice
    contents:
      type: string
      value: white
      choices:
      - name: white
        text: '{{colour_white}}'
      - name: yellow
        text: '{{colour_yellow}}'
      - name: cyan
        text: '{{colour_cyan}}'
      - name: green
        text: '{{colour_green}}'
      - name: magenta
        text: '{{colour_magenta}}'
      - name: orange
        text: '{{colour_orange}}'
      - name: red
        text: '{{colour_red}}'
      - name: black
        text: '{{colour_black}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{rotation_group}}'
  hasHeader: true
  children:
  - url: resource-grid-overlay.overlay.rotation_lines
    name: resource-grid-overlay-rotation-lines
    text: '{{rotation_lines}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: resource-grid-overlay.overlay.rotation_colour
    name: resource-grid-overlay-rotation-colour
    text: '{{rotation_colour}}'
    enabled: resource-grid-overlay.overlay.rotation_lines
    display: Choice
    contents:
      type: string
      value: cyan
      choices:
      - name: cyan
        text: '{{colour_cyan}}'
      - name: white
        text: '{{colour_white}}'
      - name: yellow
        text: '{{colour_yellow}}'
      - name: red
        text: '{{colour_red}}'
      - name: green
        text: '{{colour_green}}'
      - name: magenta
        text: '{{colour_magenta}}'
      - name: orange
        text: '{{colour_orange}}'
      - name: black
        text: '{{colour_black}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{mine_group}}'
  hasHeader: true
  children:
  - url: resource-grid-overlay.overlay.mine_boxes
    name: resource-grid-overlay-mine-boxes
    text: '{{mine_boxes}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: resource-grid-overlay.overlay.mine_colour
    name: resource-grid-overlay-mine-colour
    text: '{{mine_colour}}'
    enabled: resource-grid-overlay.overlay.mine_boxes
    display: Choice
    contents:
      type: string
      value: red
      choices:
      - name: red
        text: '{{colour_red}}'
      - name: white
        text: '{{colour_white}}'
      - name: yellow
        text: '{{colour_yellow}}'
      - name: cyan
        text: '{{colour_cyan}}'
      - name: green
        text: '{{colour_green}}'
      - name: magenta
        text: '{{colour_magenta}}'
      - name: orange
        text: '{{colour_orange}}'
      - name: black
        text: '{{colour_black}}'
  - url: resource-grid-overlay.tune.mine_size
    name: resource-grid-overlay-tune-mine-size
    text: '{{tune_mine_size}}'
    enabled: resource-grid-overlay.overlay.mine_boxes
    display: Slider
    contents:
      value: 4
      min: 1
      max: 5
      step: 1
